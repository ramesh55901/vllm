name: Build UBI9 CPU Image

on:
  push:
    branches:
      - dockerfile-cpu-0.25.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build UBI9 CPU Image
        run: |
          docker build \
            -f docker/Dockerfile.cpu.ubi9 \
            -t vllm-ubi9-cpu:latest .