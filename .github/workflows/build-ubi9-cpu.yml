name: Build Original CPU Docker Image

on:
  push:
    branches:
      - dockerfile-cpu-0.25.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Original CPU Image
        run: |
          docker build \
            --target vllm-openai \
            -f docker/Dockerfile.cpu \
            -t vllm-cpu:original .