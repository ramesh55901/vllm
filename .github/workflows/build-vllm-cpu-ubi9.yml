name: Build vLLM CPU UBI9 Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the image to GitHub Container Registry
        required: true
        type: boolean
        default: false
      image_tag:
        description: Image tag
        required: true
        type: string
        default: v0.18.0-ubi9
      max_jobs:
        description: Maximum parallel compilation jobs
        required: true
        type: string
        default: "8"

  pull_request:
    paths:
      - "docker/Dockerfile.cpu.ubi9"
      - "requirements/**"
      - "setup.py"
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "csrc/**"
      - "vllm/**"
      - ".github/workflows/build-vllm-cpu-ubi9.yml"

  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile.cpu.ubi9"
      - "requirements/**"
      - "setup.py"
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "csrc/**"
      - "vllm/**"
      - ".github/workflows/build-vllm-cpu-ubi9.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: vllm-cpu-ubi9-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vllm-cpu
  DOCKERFILE: docker/Dockerfile.cpu.ubi9
  BUILD_TARGET: vllm-openai

jobs:
  build:
    name: Build linux/amd64 CPU image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force --volumes
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GitHub Container Registry
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.push_image == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag || 'v0.18.0-ubi9' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=vLLM CPU UBI9
            org.opencontainers.image.description=vLLM v0.18.0 CPU image for linux/amd64 on UBI9

      - name: Build vLLM CPU UBI9 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ env.BUILD_TARGET }}
          platforms: linux/amd64
          push: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.push_image == true }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            TARGETARCH=amd64
            PYTHON_VERSION=3.12
            max_jobs=${{ inputs.max_jobs || '8' }}
          cache-from: type=gha,scope=vllm-cpu-ubi9-amd64
          cache-to: type=gha,mode=max,scope=vllm-cpu-ubi9-amd64
          provenance: false
          sbom: false

      - name: Show build result
        shell: bash
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Image metadata: ${{ steps.build.outputs.metadata }}"